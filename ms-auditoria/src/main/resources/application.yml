server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: ms-auditoria

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: auditoria
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      # Cada @KafkaListener indica su propio grupo; este es solo el valor por defecto.
      group-id: auditoria
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Las credenciales de AWS (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY y AWS_SESSION_TOKEN)
# las toma el SDK directamente de las variables de entorno.
aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    tabla-pagos: ${DYNAMODB_TABLA_PAGOS:MetricasPagos}

app:
  security:
    jwt:
      providers:
        - name: azure
          jwk-set-uri: ${AZURE_JWKS_URI}
          issuers:
            - ${AZURE_ISSUER_URI}
          audiences:
            - ${AZURE_CLIENT_ID}
            - api://${AZURE_CLIENT_ID}
        - name: cognito
          jwk-set-uri: ${COGNITO_JWKS_URI}
          issuers:
            - ${COGNITO_ISSUER_URI}
          audiences:
            - ${COGNITO_CLIENT_ID}
          default-role: Cliente

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
