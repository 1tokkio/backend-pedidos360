server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: ms-kafka-admin

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

app:
  security:
    jwt:
      providers:
        - name: azure
          jwk-set-uri: ${AZURE_JWKS_URI}
          issuers:
            - ${AZURE_ISSUER_URI}
          audiences:
            - ${AZURE_CLIENT_ID}
            - api://${AZURE_CLIENT_ID}
        - name: cognito
          jwk-set-uri: ${COGNITO_JWKS_URI}
          issuers:
            - ${COGNITO_ISSUER_URI}
          audiences:
            - ${COGNITO_CLIENT_ID}
          default-role: Cliente

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
