server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: ms-pagos

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: pagos
    open-in-view: false

  kafka:
    # El productor se arma a mano en config/ProductorConfig.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: fraude
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  fraude:
    monto-maximo: ${FRAUDE_MONTO_MAXIMO:500000}
    # 3 intentos en menos de 10 segundos: ningun cliente real paga tan rapido, es un bot.
    intentos-maximos: ${FRAUDE_INTENTOS_MAXIMOS:3}
    ventana-segundos: ${FRAUDE_VENTANA_SEGUNDOS:10}
    bloqueo-minutos: ${FRAUDE_BLOQUEO_MINUTOS:30}
  webpay:
    url-base: ${WEBPAY_URL_BASE:https://webpay3gint.transbank.cl}
    codigo-comercio: ${WEBPAY_CODIGO_COMERCIO}
    llave: ${WEBPAY_LLAVE}
    return-url: ${WEBPAY_RETURN_URL}
  security:
    jwt:
      providers:
        - name: azure
          jwk-set-uri: ${AZURE_JWKS_URI}
          issuers:
            - ${AZURE_ISSUER_URI}
          audiences:
            - ${AZURE_CLIENT_ID}
            - api://${AZURE_CLIENT_ID}
        - name: cognito
          jwk-set-uri: ${COGNITO_JWKS_URI}
          issuers:
            - ${COGNITO_ISSUER_URI}
          audiences:
            - ${COGNITO_CLIENT_ID}
          default-role: Cliente

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
